name: pages

# Builds and deploys the site on every push to main. Since the Phase 2
# cutover, data/public/ and media/ are written by dhfolio/atlas-data's publish
# workflow (a deploy-key push, which starts this workflow), not by a
# scheduled mirror of researchatlas.io. See .publish-enabled.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # A manual run can be started from any ref; only main is ever deployed.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Branch tip rather than the event SHA: a run that queued behind another must not deploy older data.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build
        run: node tools/build-site.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
